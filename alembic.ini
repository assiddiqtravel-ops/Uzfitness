# Alembic konfiguratsiyasi (migratsiyalar). Odatiy holda bot init_db() bilan
# jadvallarni yaratadi; Alembic murakkabroq migratsiyalar uchun ixtiyoriy.
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url env.py ichida DATABASE_URL dan olinadi (async URL sync ga aylantiriladi).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
